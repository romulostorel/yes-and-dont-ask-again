:root{
  /* warm near-black terminal; neutrals biased toward the coral accent */
  --ground:#0b0a09;
  --ground-lift:#131110;
  --ink:#e6e0d8;
  --dim:#7a746c;
  --faint:#3a3632;
  --hair:#211f1d;

  --coral:#d97757;   /* Claude's own accent — the ✻ */
  --green:#6bbf7f;
  --amber:#d9a441;
  --red:#e0554c;

  --glyph:#57534d;   /* the box-drawing / ╰ tone: below text, above border */

  /* symbol faces appended so ✻ ╰ ▸ resolve deterministically rather than
     landing on whatever the platform picks for the tofu */
  --mono:"GeistMono",ui-monospace,"SF Mono",Menlo,Consolas,
         "Apple Symbols","Segoe UI Symbol",monospace;

  --line:1.55;
  --pad:clamp(14px,3.5vw,30px);
  --col:104ch;
}

/* Single-theme by intent: the page is a screen, and a screen stays a screen.
   Tokens are still pinned under every theme signal so the host toggle can't
   half-invert it into something unreadable. */
:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--mono);
  font-size:clamp(12.5px,2.55vw,14.5px);
  line-height:var(--line);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-variant-ligatures:none;
}

/* ── shell ─────────────────────────────────────────────── */
#shell{display:flex;flex-direction:column;height:100%;position:relative}

#screen{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  padding:var(--pad) var(--pad) 8px;
  scrollbar-width:thin;
  scrollbar-color:var(--faint) transparent;
  transform-origin:50% 45%;
}
#screen::-webkit-scrollbar{width:9px}
#screen::-webkit-scrollbar-thumb{background:var(--faint)}

#flow{max-width:var(--col);display:flex;flex-direction:column;gap:.85em}

/* ── generic terminal rows ─────────────────────────────── */
.row{white-space:pre-wrap;overflow-wrap:anywhere}
.prose{color:var(--ink)}
.dim{color:var(--dim)}
.faint{color:var(--faint)}
.coral{color:var(--coral)}
.green{color:var(--green)}
.amber{color:var(--amber)}
.red{color:var(--red)}

/* tool call: ● Bash(cmd) + ╰ result */
.tool{display:flex;flex-direction:column;gap:.1em}
.tool .head{white-space:pre-wrap;overflow-wrap:anywhere}
.tool .bullet{color:var(--ink)}
.tool.ok .bullet{color:var(--green)}
.tool.bad .bullet{color:var(--red)}
.tool .name{color:var(--ink)}
.tool .args{color:var(--dim)}
/* the ╰ hangs in the gutter so every wrapped and newline'd output line
   stays aligned under the first one, the way the real transcript does */
.tool .out{
  color:var(--dim);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding-left:5ch;
  text-indent:-3ch;
}
.tool .out .lead{color:var(--glyph)}
.diff{padding-left:2ch;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .del{color:#c96a63}
.diff .add{color:var(--green)}
.diff .ctx{color:var(--faint)}

/* the receipt stamp on a command you didn't read */
.stamp{
  color:var(--red);
  font-size:.82em;
  letter-spacing:.03em;
  padding-left:1ch;
}
.stamp.read{color:var(--faint)}

/* ── welcome box + permission box (CSS borders read as TUI boxes) ── */
.box{
  border:1px solid var(--faint);
  border-radius:5px;
  padding:.75em 1.1em;
  display:flex;
  flex-direction:column;
  gap:.55em;
  max-width:100%;
}
.box.welcome{border-color:var(--hair)}

.ask{
  border-color:var(--faint);
  transition:border-color .5s ease,box-shadow .5s ease;
}
.ask[data-tier="3"]{border-color:#6a5527;box-shadow:0 0 0 1px #6a552733}
.ask[data-tier="4"]{border-color:#7a3630;box-shadow:0 0 0 1px #7a363033}
.ask[data-tier="5"]{
  border-color:var(--red);
  box-shadow:0 0 0 1px #e0554c33,0 0 34px -12px #e0554c66;
}
.ask .kind{color:var(--dim)}
.ask[data-tier="4"] .kind,.ask[data-tier="5"] .kind{color:var(--red)}
.ask .cmd{color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.ask .why{color:var(--dim)}
.ask .q{color:var(--ink);margin-top:.2em}

.opts{display:flex;flex-direction:column;gap:1px;margin:0;padding:0;list-style:none}
.opt{
  display:flex;
  gap:.5ch;
  align-items:baseline;
  padding:.32em .5em .32em 0;
  min-height:34px;
  color:var(--dim);
  cursor:pointer;
  border:0;
  background:none;
  font:inherit;
  text-align:left;
  width:100%;
  border-radius:3px;
  transition:color .12s ease,background .12s ease;
}
.opt .caret{width:2ch;flex:0 0 2ch;color:var(--coral)}
.opt .txt{overflow-wrap:anywhere}
.opt[aria-selected="true"]{color:var(--ink);background:#ffffff08}
.opt:hover{color:var(--ink)}
.opt:focus-visible{outline:1px solid var(--coral);outline-offset:1px}
.ask.spent .opt{cursor:default;pointer-events:none}
.ask.spent{opacity:.62;border-color:var(--hair)!important;box-shadow:none!important}

/* the ghost keystroke when accept-edits auto-fires for you */
.ghostkey{color:var(--coral)}

/* ── spinner line ──────────────────────────────────────── */
.spin{display:flex;gap:.6ch;color:var(--coral);align-items:baseline}
.spin .meta{color:var(--dim)}
.spin .glyph{display:inline-block;width:1ch}

/* ── status line ───────────────────────────────────────── */
#status{
  flex:0 0 auto;
  border-top:1px solid var(--hair);
  background:var(--ground);
  padding:.5em var(--pad);
  display:flex;
  flex-wrap:wrap;
  gap:.4em 2ch;
  align-items:baseline;
  font-size:.85em;
  color:var(--dim);
}
#status .grow{flex:1 1 auto;min-width:0}
#status b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
#autopill{color:var(--coral);white-space:nowrap}
#autopill[hidden]{display:none}
.pulse{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#burn{font-variant-numeric:tabular-nums;white-space:nowrap}
#ctx{font-variant-numeric:tabular-nums;white-space:nowrap}

/* honest label — this is a parody, nothing runs */
#legal{
  font-size:.78em;
  color:var(--faint);
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ── death ─────────────────────────────────────────────── */
#screen.dying{animation:collapse .95s cubic-bezier(.7,0,.3,1) forwards}
@keyframes collapse{
  0%{filter:none;transform:scaleY(1)}
  22%{filter:brightness(3.4) contrast(.6)}
  55%{filter:brightness(.2);transform:scaleY(.02) scaleX(1.04)}
  100%{filter:brightness(0);transform:scaleY(0) scaleX(1.15);opacity:0}
}

#slate{
  position:absolute;
  inset:0;
  background:var(--ground);
  overflow-y:auto;
  padding:var(--pad);
  display:none;
}
#slate.up{display:block;animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slate-col{max-width:76ch;margin:0 auto;display:flex;flex-direction:column;gap:1.6em;padding:2.5vh 0 6vh}

/* drawn, not typed: block/shade characters tofu out in most mono faces */
.rule{
  height:1px;
  border:0;
  background:linear-gradient(90deg,var(--red) 0%,var(--faint) 18%,var(--hair) 62%,transparent 100%);
}

.deadhead{display:flex;flex-direction:column}
.deadhead .kicker{
  color:var(--red);
  font-size:.85em;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:.9em;
}
.deadhead h1{
  margin:0;
  font-weight:500;
  font-size:clamp(2.1rem,10.5vw,4.1rem);
  line-height:.94;
  letter-spacing:-.045em;
  text-wrap:balance;
  color:var(--ink);
}
.deadhead h1 .cur{
  display:inline-block;
  width:.56em;
  height:.78em;
  margin-left:.12em;
  vertical-align:baseline;
  background:var(--red);
  animation:blink 1.05s steps(1,end) infinite;
}
@keyframes blink{50%{opacity:0}}
.deadhead .lede{color:var(--dim);margin:1.1em 0 0;max-width:52ch}

.stats{display:flex;flex-direction:column;gap:0}
.stat{
  display:flex;
  align-items:baseline;
  gap:1ch;
  padding:.5em 0;
  border-bottom:1px solid var(--hair);
}
.stat .k{color:var(--dim);flex:0 1 auto}
.stat .fill{flex:1 1 auto;border-bottom:1px dotted var(--hair);align-self:flex-end;height:.55em;min-width:1ch}
.stat .v{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v.hot{color:var(--red)}
.stat .v.cool{color:var(--green)}

.rank{display:flex;flex-direction:column;gap:.35em}
.rank .lbl{color:var(--dim);font-size:.85em;letter-spacing:.18em;text-transform:uppercase}
.rank .val{
  color:var(--coral);
  font-size:clamp(1.25rem,5.2vw,1.9rem);
  letter-spacing:-.01em;
}
.rank .note{color:var(--dim);max-width:54ch}

.ledger h2,.slate-col h2{
  margin:0 0 .7em;
  font-size:.85em;
  font-weight:400;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--dim);
}
.ledger .scrollbox{
  max-height:34vh;
  overflow-y:auto;
  border:1px solid var(--hair);
  border-radius:5px;
  padding:.6em .9em;
  scrollbar-width:thin;
  scrollbar-color:var(--faint) transparent;
}
.led{
  display:grid;
  grid-template-columns:1.5ch minmax(0,1fr) auto;
  gap:0 1ch;
  align-items:baseline;
  padding:.34em 0;
  border-bottom:1px solid var(--hair);
}
.led:last-child{border-bottom:0}
.led .mk{color:var(--green)}
.led .mk.no{color:var(--dim)}
.led .c{overflow-wrap:anywhere;color:var(--ink)}
.led .t{color:var(--red);font-variant-numeric:tabular-nums;font-size:.85em}
/* the clause you actually agreed to, pulled out of the wall it was buried in */
.led .tell{
  grid-column:2 / -1;
  color:var(--red);
  font-size:.86em;
  padding-top:.15em;
  overflow-wrap:anywhere;
}
.led.rejected .tell{color:var(--faint)}
.led .t.ok{color:var(--faint)}
.led.rejected .c{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}

.acts{display:flex;flex-wrap:wrap;gap:.7em}
button.act{
  font:inherit;
  color:var(--ink);
  background:none;
  border:1px solid var(--faint);
  border-radius:4px;
  padding:.6em 1.15em;
  min-height:44px;
  cursor:pointer;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
button.act:hover{border-color:var(--coral);color:var(--coral)}
button.act:focus-visible{outline:1px solid var(--coral);outline-offset:2px}
button.act.primary{border-color:var(--coral);color:var(--coral)}
button.act.primary:hover{background:#d977571a}

.smallprint{color:var(--faint);font-size:.82em;max-width:56ch}
.smallprint a{color:var(--dim)}

/* thumbs need more than the terminal-tight desktop rhythm */
@media (max-width:620px){
  .opt{min-height:44px;padding-top:.55em;padding-bottom:.55em}
  .opts{gap:2px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #screen.dying{animation:none;opacity:0}
}
</style>

</head>
<body>
<div id="shell">
  <div id="screen" tabindex="-1">
    <div id="flow"></div>
  </div>

  <div id="status">
    <span id="autopill" hidden><span class="pulse">▸▸ accept edits on</span></span>
    <span id="hint" class="grow">1 / 2 / 3 · ↑↓ + enter · esc = no</span>
    <span id="ctx"></span>
    <span id="burn"></span>
    <span id="legal">simulador · nada é executado</span>
  </div>

  <div id="slate" aria-live="polite"></div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   tigrinho.dev — a Claude Code simulator whose only mechanic
   is the permission prompt. Nothing here executes anything;
   every command is a string and every output is a fixture.
   ═══════════════════════════════════════════════════════════ */

const flow   = document.getElementById("flow");
const screenEl = document.getElementById("screen");
const slate  = document.getElementById("slate");
const autopill = document.getElementById("autopill");
const hintEl = document.getElementById("hint");
const ctxEl  = document.getElementById("ctx");
const burnEl = document.getElementById("burn");

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  accepts:0,
  rejects:0,
  consecutiveRejects:0,
  autoAccepted:0,
  auto:false,             /* "yes, and don't ask again" */
  autoAt:null,
  tokens:0,
  ledger:[],              /* {cmd, ms, accepted, auto} */
  t0:Date.now(),
  ctx:100,
  compacted:false,
  over:false,
  fastest:Infinity,
};

/* ── helpers ─────────────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms,60) : ms));
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function add(node){
  flow.appendChild(node);
  stick();
  return node;
}
let pinned = true;
screenEl.addEventListener("scroll", () => {
  pinned = screenEl.scrollHeight - screenEl.scrollTop - screenEl.clientHeight < 44;
});
function stick(){ if (pinned) screenEl.scrollTop = screenEl.scrollHeight; }

/* a wall-of-text command has to collapse to one line in the transcript header
   and in the ledger, or it drowns both — the box is the only place it runs long */
function oneLine(cmd, max){
  const lines = cmd.trim().split("\n");
  const more = lines.length > 1;
  /* drop the shell line-continuation slash — it reads as a typo once truncated */
  let s = lines[0].replace(/\s*\\$/, "");
  const cap = max || 72;
  if (s.length > cap) return s.slice(0, cap - 1).trimEnd() + "…";
  return more ? s + " …" : s;
}

function money(){ return (S.tokens/1000 * 0.0271).toFixed(2); }
function elapsed(){
  const s = Math.floor((Date.now()-S.t0)/1000);
  return `${Math.floor(s/60)}min ${String(s%60).padStart(2,"0")}s`;
}
function burnTokens(n){
  S.tokens += n;
  S.ctx = Math.max(3, S.ctx - n/9200);
  paintStatus();
}
function paintStatus(){
  const k = S.tokens >= 1000 ? (S.tokens/1000).toFixed(1)+"k" : String(Math.round(S.tokens));
  burnEl.innerHTML = `↑ <b>${k}</b> tokens · <b>$${money()}</b>`;
  burnEl.style.color = S.tokens > 420000 ? "var(--red)" : S.tokens > 180000 ? "var(--amber)" : "";
  ctxEl.textContent = `context left: ${Math.round(S.ctx)}%`;
  ctxEl.style.color = S.ctx < 18 ? "var(--red)" : S.ctx < 40 ? "var(--amber)" : "";
}

/* type text in, char by char */
async function type(node, text, cps){
  if (REDUCED){ node.textContent = text; stick(); return; }
  const step = 1000/(cps||220);
  let i = 0;
  while (i < text.length){
    const chunk = Math.max(1, Math.round(rnd(1,3)));
    node.textContent += text.slice(i, i+chunk);
    i += chunk;
    stick();
    await sleep(step*chunk);
  }
}

/* ── renderers ───────────────────────────────────────────── */

function toolNode(name, args, {ok,bad}={}){
  const n = el("div","tool"+(ok?" ok":bad?" bad":""));
  const head = el("div","head");
  head.appendChild(el("span","bullet","● "));
  head.appendChild(el("span","name",name));
  head.appendChild(el("span","args","("+args+")"));
  n.appendChild(head);
  return n;
}
/* ╰ rather than Claude Code's ⎿ — U+23BF is absent from Geist Mono and falls
   out of the monospace grid; the rounded corner is present and matches better */
function outNode(){
  const n = el("div","out");
  n.appendChild(el("span","lead","╰  "));
  n.appendChild(el("span","body"));
  return n;
}
function diffNode(rows){
  const n = el("div","diff");
  for (const [k,t] of rows) n.appendChild(el("div",k,t));
  return n;
}

async function say(text){
  const n = add(el("div","row prose"));
  await type(n, text, 210);
  burnTokens(rnd(400,1400));
  await sleep(rnd(180,420));
}

/* the working spinner, exactly where Claude Code puts it: inline */
async function work(ms){
  const n = add(el("div","row spin"));
  const g = el("span","glyph","✳");
  const v = el("span",null, (S.tokens > 200000 ? pick(VERBS_OFF) : pick(VERBS_OK)) + "…");
  const m = el("span","meta","");
  n.append(g,v,m);
  const glyphs = ["✳","✢","✳","∗","✻","✽"];
  const t = Date.now();
  let i = 0;
  const iv = setInterval(() => {
    g.textContent = glyphs[++i % glyphs.length];
    const secs = Math.round((Date.now()-t)/1000);
    m.textContent = `(${secs}s · ↑ ${(S.tokens/1000).toFixed(1)}k tokens · esc to interrupt)`;
  }, REDUCED ? 400 : 110);
  await sleep(ms);
  clearInterval(iv);
  n.remove();
}

async function freebie(){
  const f = pick(FREEBIES);
  await work(rnd(500,1100));
  const n = add(toolNode(f.n, f.a));
  const o = outNode();
  n.appendChild(o);
  await type(o.querySelector(".body"), f.o, 700);
  burnTokens(rnd(1500,5000));
  await sleep(rnd(150,380));
}

function askBox(step, tier){
  const box = el("div","box ask");

  const kindLabel = step.kind === "Edit" ? "Edit file"
    : step.kind === "Write" ? "Create file"
    : step.kind === "MCP" ? "MCP tool call"
    : "Bash command";
  box.appendChild(el("div","kind",kindLabel));

  const body = el("div");
  body.style.cssText = "display:flex;flex-direction:column;gap:.15em;padding-left:2ch";
  body.appendChild(el("div","cmd", step.c));
  body.appendChild(el("div","why", step.w));
  box.appendChild(body);

  box.appendChild(el("div","q","Do you want to proceed?"));

  const ul = el("ul","opts");
  const dontAsk = step.kind === "Edit" || step.kind === "Write"
    ? "Yes, and don't ask again this session (shift+tab)"
    : `Yes, and don't ask again for ${step.c.trim().split(/\s+/)[0]} commands in ~/dev/tigrinho`;
  const labels = ["Yes", dontAsk, "No, and tell Claude what to do differently (esc)"];

  labels.forEach((txt,i) => {
    const li = el("li");
    const b = el("button","opt");
    b.type = "button";
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.appendChild(el("span","caret", i === 0 ? "❯" : ""));
    b.appendChild(el("span","txt", `${i+1}. ${txt}`));
    b.addEventListener("click", () => choose(i+1));
    b.addEventListener("mouseenter", () => select(i));
    li.appendChild(b);
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}

function select(i){
  if (!live) return;
  live.idx = i;
  live.box.querySelectorAll(".opt").forEach((o,j) => {
    const on = j === i;
    o.setAttribute("aria-selected", on ? "true" : "false");
    o.querySelector(".caret").textContent = on ? "❯" : "";
  });
}

function choose(n){
  if (!live || live.done) return;
  live.done = true;
  const ms = Date.now() - live.t0;
  live.box.classList.add("spent");
  live.box.querySelectorAll(".opt").forEach((o,j) => {
    if (j !== n-1) o.style.display = "none";
    else o.querySelector(".caret").textContent = "❯";
  });
  const r = live.resolve;
  live = null;
  hintEl.textContent = "1 / 2 / 3 · ↑↓ + enter · esc = no";
  r({n, ms});
}

async function ask(step, tier){
  const box = add(askBox(step, tier));

  /* accept-edits already on? Claude presses 1 for you. */
  if (S.auto){
    await sleep(REDUCED ? 40 : rnd(340,620));
    const g = el("div","row ghostkey","→ 1");
    box.parentNode.insertBefore(g, box.nextSibling);
    stick();
    box.classList.add("spent");
    box.querySelectorAll(".opt").forEach((o,j) => { if (j !== 0) o.style.display = "none"; });
    S.autoAccepted++;
    hintEl.textContent = "você desligou as perguntas · shift+tab pra voltar";
    return {n:1, ms:0, auto:true};
  }

  return new Promise(res => {
    live = {resolve:res, box, idx:0, t0:Date.now(), done:false};
  });
}

document.addEventListener("keydown", e => {
  if (S.over) return;

  /* shift+tab cycles accept-edits, same as the real thing — the one way
     back once you've handed over the wheel */
  if (e.key === "Tab" && e.shiftKey){
    e.preventDefault();
    S.auto = !S.auto;
    if (S.auto && S.autoAt === null) S.autoAt = S.accepts;
    autopill.hidden = !S.auto;
    hintEl.textContent = S.auto
      ? "você desligou as perguntas · shift+tab pra voltar"
      : "1 / 2 / 3 · ↑↓ + enter · esc = no";
    return;
  }

  if (!live) return;
  if (e.key === "1" || e.key === "2" || e.key === "3"){ e.preventDefault(); choose(+e.key); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); select(Math.min(2, live.idx+1)); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); select(Math.max(0, live.idx-1)); }
  else if (e.key === "Enter"){ e.preventDefault(); choose(live.idx+1); }
  else if (e.key === "Escape"){ e.preventDefault(); choose(3); }
});

/* ── execution theatre ───────────────────────────────────── */

async function runStep(step, tierN){
  const name = step.kind === "Edit" ? "Update"
    : step.kind === "Write" ? "Write"
    : step.kind === "MCP" ? step.c.split(" - ")[0]
    : "Bash";
  const args = step.kind === "MCP" ? step.c.split(" - ")[1] + " (MCP)" : oneLine(step.c);

  await work(rnd(600,1500));
  const n = add(toolNode(name, args, {ok:step.ok, bad:step.bad || tierN >= 4}));

  if (step.diff){
    const o = outNode();
    o.querySelector(".body").textContent = step.o;
    n.appendChild(o);
    n.appendChild(diffNode(step.diff));
    stick();
  } else if (step.o){
    const o = outNode();
    n.appendChild(o);
    await type(o.querySelector(".body"), step.o, 900);
  } else {
    const o = outNode();
    o.querySelector(".body").textContent = step.note || "(no output)";
    o.querySelector(".body").className = "body faint";
    n.appendChild(o);
    stick();
  }
  burnTokens(rnd(3000,9000));
  await sleep(rnd(250,600));

  if (step.after){
    await work(rnd(400,900));
    const a = add(toolNode(step.after.n, step.after.a, {bad:step.after.bad}));
    const o = outNode();
    a.appendChild(o);
    await type(o.querySelector(".body"), step.after.o, 700);
    burnTokens(rnd(800,2000));
    await sleep(500);
  }
}

/* ── main loop ───────────────────────────────────────────── */

function tierFor(){
  const a = S.accepts;
  if (a < 3) return 1;
  if (a < 8) return 2;
  if (a < 15) return 3;
  return 4;
}
function killAt(){
  /* autoplay drags you to the end faster — that's the trade you made */
  return S.auto ? 20 : 27;
}

const used = new Set();
function nextStep(tier){
  const pool = TIERS[tier].filter(s => !used.has(s.c));
  const list = pool.length ? pool : TIERS[tier];
  const s = pick(list);
  used.add(s.c);
  return s;
}

async function boot(){
  const box = add(el("div","box welcome"));
  const l1 = el("div","row");
  l1.appendChild(el("span","coral","✻ "));
  l1.appendChild(el("span",null,"Welcome to Claude Code!"));
  box.appendChild(l1);
  box.appendChild(el("div","row dim","  /help for help, /status for your current setup"));
  box.appendChild(el("div","row dim","  cwd: /Users/you/dev/tigrinho"));
  paintStatus();
  await sleep(REDUCED ? 30 : 620);

  const p = add(el("div","row"));
  p.appendChild(el("span","dim","> "));
  const q = el("span");
  p.appendChild(q);
  await type(q, "os testes estão quebrando no CI, resolve pra mim", 55);
  await sleep(560);
}

async function main(){
  await boot();

  let tierN = 1, sinceProse = 99;

  while (!S.over){
    tierN = tierFor();

    /* prose beat */
    if (sinceProse >= 2 && Math.random() < .75){
      await say(pick(PROSE[Math.min(4,tierN)]));
      sinceProse = 0;
    } else sinceProse++;

    /* a free read/grep now and then — the rest between prompts */
    if (Math.random() < .45) await freebie();

    /* context runs out; Claude compacts and forgets why it started */
    if (!S.compacted && S.ctx < 26){
      S.compacted = true;
      const n = add(toolNode("Compacting conversation", "auto"));
      const o = outNode();
      n.appendChild(o);
      await type(o.querySelector(".body"),
        "Compacted 41 messages into a summary. Some context was dropped.", 800);
      S.ctx = 74;
      paintStatus();
      await sleep(700);
      await say("Let me re-read the files to get back up to speed.");
    }

    /* the kill */
    if (S.accepts >= killAt()){
      await say(PROSE[5][0]);
      const r = await ask(KILL, 5);
      record(KILL, r, r.n !== 3);
      if (r.n !== 3){ await runStep(KILL, 5); return die("root"); }

      /* refusing at the last second does not save you: Claude takes the note,
         splits the command "so it's easier to review", and runs both halves */
      S.rejects++;
      await say("You're absolutely right — I shouldn't chain the cleanup onto the backup.");
      await sleep(320);
      await say("Let me split it into two steps so it's easier to review.");
      await sleep(420);

      await work(rnd(700,1200));
      const tar = add(toolNode("Bash", KILL_TAR.c, {ok:true}));
      const to = outNode();
      tar.appendChild(to);
      await type(to.querySelector(".body"), KILL_TAR.o, 800);
      await sleep(700);

      const n = add(toolNode("Bash", KILL_ALT.c, {bad:true}));
      const o = outNode();
      n.appendChild(o);
      await type(o.querySelector(".body"), KILL.o, 900);
      S.ledger.push({cmd:KILL_ALT.c, ms:0, accepted:true, forced:true});
      return die("root");
    }

    /* an ordinary prompt */
    const step = nextStep(tierN);
    const r = await ask(step, tierN);

    if (r.n === 3){
      S.rejects++;
      S.consecutiveRejects++;
      record(step, r, false);
      await sleep(340);
      await say(pick([
        "You're absolutely right! Let me try a different approach.",
        "Good call. Let me handle this a different way.",
        "Understood — I'll avoid that.",
      ]));
      if (S.consecutiveRejects >= 6) return die("auditor");
      continue;
    }

    S.consecutiveRejects = 0;
    S.accepts++;
    if (r.n === 2 && !S.auto){
      S.auto = true;
      S.autoAt = S.accepts;
      autopill.hidden = false;
    }
    record(step, r, true);
    if (r.ms && r.ms < S.fastest) S.fastest = r.ms;
    await runStep(step, tierN);
  }
}

function record(step, r, accepted){
  S.ledger.push({cmd:step.c, ms:r.ms||0, accepted, auto:!!r.auto, tell:step.tell});
  /* the receipt, stamped right under the box you just cleared.
     auto-accepts already show their own "→ 1" ghost keystroke. */
  if (accepted && !r.auto){
    const secs = r.ms/1000;
    const s = el("div","row stamp"+(secs >= 2.5 ? " read":""));
    s.textContent = `   ${secs < 10 ? secs.toFixed(1) : Math.round(secs)}s na tela${secs < 1 ? " · não lido" : ""}`;
    add(s);
  }
}

/* ── endings ─────────────────────────────────────────────── */

function readStats(){
  const seen = S.ledger.filter(l => !l.auto && !l.forced);
  const accepted = S.ledger.filter(l => l.accepted);
  const read = accepted.filter(l => !l.auto && l.ms >= 2500);
  const times = seen.filter(l => l.accepted).map(l => l.ms);
  const avg = times.length ? times.reduce((a,b)=>a+b,0)/times.length : 0;
  return {
    accepted:accepted.length,
    read:read.length,
    ratio: accepted.length ? read.length/accepted.length : 1,
    avg,
  };
}

function rankFor(kind, st){
  if (kind === "auditor")
    return {name:"AUDITOR", note:"Você leu tudo e recusou tudo. Estatisticamente, você não existe."};
  if (st.ratio >= .5)
    return {name:"CODE REVIEWER", note:"Você leu mais da metade. Raro, chato, respeitável."};
  if (S.auto && st.ratio < .12)
    return {name:"▸▸ ENJOYER", note:`Você entregou o volante no aceite nº ${S.autoAt} e nunca pediu de volta.`};
  if (st.avg > 0 && st.avg < 900)
    return {name:"ENTER KEY ENTHUSIAST", note:"Média abaixo de um segundo por comando. Isso não é leitura, é reflexo."};
  if (st.ratio >= .2)
    return {name:"VIBE CODER", note:"Você leu o suficiente pra se sentir responsável. Não foi."};
  return {name:"VIBE CODER TERMINAL", note:"Em algum momento você parou de ler e começou a torcer."};
}

async function die(kind){
  S.over = true;
  live = null;
  hintEl.textContent = "";

  if (kind === "root"){
    await sleep(500);
    const n = add(el("div","row red"));
    await type(n, "zsh: command not found: zsh", 400);
    await sleep(900);
  } else {
    await sleep(300);
    await say("Vou parar aqui. Você revisou 6 comandos e não aceitou nenhum.");
    await sleep(800);
  }

  screenEl.classList.add("dying");
  await sleep(REDUCED ? 60 : 980);
  screenEl.style.display = "none";
  buildSlate(kind);
}

function buildSlate(kind){
  const st = readStats();
  const rank = rankFor(kind, st);
  const survived = elapsed();

  const col = el("div","slate-col");

  /* header */
  const h = el("div","deadhead");
  h.appendChild(el("div","kicker", kind === "auditor" ? "sessão encerrada pelo claude" : "sessão encerrada"));
  const h1 = el("h1");
  if (kind === "auditor"){
    h1.appendChild(el("span",null,"NADA\nACONTECEU"));
  } else {
    h1.appendChild(el("span",null,"SESSION\nTERMINATED"));
  }
  h1.appendChild(el("span","cur"));
  h1.style.whiteSpace = "pre-line";
  h.appendChild(h1);
  h.appendChild(el("p","lede", kind === "auditor"
    ? "Você chegou ao fim sem autorizar um único comando. O projeto está exatamente como estava. É o único final feliz que este site tem."
    : "O Claude removeu a raiz do sistema de arquivos. Você autorizou. Provavelmente sem ler."));
  col.appendChild(h);

  col.appendChild(el("hr","rule"));

  /* stats */
  const dur = ms => ms < 1000 ? Math.round(ms)+"ms" : (ms/1000).toFixed(1)+"s";

  const stats = el("div","stats");
  const rows = [
    ["comandos aceitos", String(st.accepted), st.accepted > 20 ? "hot" : ""],
    ["desses, realmente lidos", String(st.read),
      st.ratio >= .5 ? "cool" : st.ratio < .2 ? "hot" : ""],
    ["comandos recusados", String(S.rejects), S.rejects > 0 ? "cool" : ""],
    ["tempo médio antes do enter", st.avg ? dur(st.avg) : "—", st.avg && st.avg < 1000 ? "hot" : ""],
    ["aceite mais rápido", S.fastest < Infinity ? dur(S.fastest) : "—",
      S.fastest < 500 ? "hot" : ""],
    ["aceitos no automático", String(S.autoAccepted), S.autoAccepted > 0 ? "hot" : ""],
    ["tokens queimados", (S.tokens/1000).toFixed(1)+"k", ""],
    ["custo da sessão", "$"+money(), ""],
    ["sobreviveu", survived, ""],
  ];
  for (const [k,v,cls] of rows){
    const r = el("div","stat");
    r.appendChild(el("span","k",k));
    r.appendChild(el("span","fill"));
    r.appendChild(el("span","v "+(cls||""),v));
    stats.appendChild(r);
  }
  col.appendChild(stats);

  /* rank */
  const rk = el("div","rank");
  rk.appendChild(el("div","lbl","seu rank"));
  rk.appendChild(el("div","val",rank.name));
  rk.appendChild(el("div","note",rank.note));
  col.appendChild(rk);

  /* the receipt */
  if (S.ledger.length){
    const led = el("div","ledger");
    led.appendChild(el("h2","o que você autorizou"));
    const sb = el("div","scrollbox");
    for (const l of S.ledger){
      const r = el("div","led"+(l.accepted ? "" : " rejected"));
      const mk = el("span","mk"+(l.accepted ? "" : " no"), l.accepted ? "✔" : "✗");
      r.appendChild(mk);
      r.appendChild(el("span","c", oneLine(l.cmd, 58)));
      if (l.accepted){
        const t = l.forced ? "forçado"
          : l.auto ? "▸▸"
          : (l.ms/1000).toFixed(1)+"s";
        r.appendChild(el("span","t"+(!l.auto && !l.forced && l.ms >= 2500 ? " ok":""), t));
      }
      if (l.tell) r.appendChild(el("div","tell","└ " + l.tell));
      sb.appendChild(r);
    }
    led.appendChild(sb);
    col.appendChild(led);
  }

  /* actions */
  const acts = el("div","acts");
  const copy = el("button","act primary","copiar resultado");
  copy.type = "button";
  copy.addEventListener("click", async () => {
    const txt = shareText(kind, st, rank, survived);
    try{
      await navigator.clipboard.writeText(txt);
      copy.textContent = "copiado ✔";
    }catch{
      /* clipboard blocked — show it so it can still be selected by hand */
      const ta = el("textarea");
      ta.value = txt;
      ta.style.cssText = "width:100%;min-height:9em;background:var(--ground-lift);color:var(--ink);border:1px solid var(--faint);border-radius:4px;font:inherit;padding:.6em";
      copy.replaceWith(ta);
      ta.select();
    }
    setTimeout(() => { if (copy.isConnected) copy.textContent = "copiar resultado"; }, 2200);
  });
  const again = el("button","act","rodar de novo");
  again.type = "button";
  again.addEventListener("click", () => location.reload());
  acts.append(copy, again);
  col.appendChild(acts);

  col.appendChild(el("p","smallprint",
    "Simulador. Nenhum comando desta página foi executado em lugar nenhum — todo output é ficção escrita à mão. O Claude Code de verdade pede permissão pelo mesmo motivo que este site existe: porque ler o comando é a única parte que não dá pra automatizar."));

  slate.appendChild(col);
  slate.classList.add("up");
  slate.scrollTop = 0;
}

function shareText(kind, st, rank, survived){
  const L = [];
  L.push("tigrinho.dev — " + (kind === "auditor" ? "NADA ACONTECEU" : "SESSION TERMINATED"));
  L.push("");
  L.push(`Aceitei ${st.accepted} comandos. Li ${st.read}.`);
  if (st.avg) L.push(`Média antes do enter: ${(st.avg/1000).toFixed(1)}s`);
  if (S.autoAccepted) L.push(`${S.autoAccepted} passaram no automático (▸▸).`);
  L.push(`Queimei $${money()} em tokens.`);
  L.push("");
  L.push(`Rank: ${rank.name}`);
  L.push(kind === "auditor"
    ? `Não deixei o Claude fazer nada em ${survived}.`
    : `Deletei a raiz do sistema em ${survived}.`);
  return L.join("\n");
}

main();
</script>
